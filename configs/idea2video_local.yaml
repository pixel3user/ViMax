# ViMax Local Configuration
# ===========================
# Uses:
#   - Claude (Sonnet/Opus) via Anthropic API for scripting/planning
#   - FLUX.1-dev (local) for image generation
#   - LTX-Video 2 (local) for video generation
#
# Hardware: RTX PRO 6000 (96GB VRAM) or any 24GB+ GPU
#
# Required environment variables:
#   - ANTHROPIC_API_KEY: Your Anthropic API key for Claude
#
# Optional: Set HF_TOKEN for gated model access (FLUX.1-dev requires acceptance)

chat_model:
  init_args:
    # Claude Sonnet 4.6 via Anthropic API (used for scripting, storyboarding, etc.)
    # Change to "anthropic/claude-sonnet-4-20250514" or similar as needed
    model: anthropic/claude-sonnet-4-20250514
    model_provider: openai
    api_key:  # Set ANTHROPIC_API_KEY env var, or paste key here
    base_url: https://api.anthropic.com/v1
  max_requests_per_minute: 50
  max_requests_per_day: 1000

image_generator:
  class_path: tools.ImageGeneratorFluxLocal
  init_args:
    # FLUX.1-dev: High quality, ~5-10 sec/image on 96GB GPU
    # Alternative: "black-forest-labs/FLUX.1-schnell" for 4-step fast generation
    model_id: "black-forest-labs/FLUX.1-dev"
    num_inference_steps: 28
    height: 900
    width: 1600
    guidance_scale: 3.5
    device: "cuda"
    dtype: "bfloat16"
  max_requests_per_minute: null
  max_requests_per_day: null

video_generator:
  class_path: tools.VideoGeneratorLTXLocal
  init_args:
    # LTX-Video 2: Fast video generation, ~10-15 sec/clip on 96GB GPU
    model_id: "Lightricks/LTX-Video-0.9.7"
    num_inference_steps: 30
    height: 720
    width: 1280
    num_frames: 121  # ~5 seconds at 24fps
    fps: 24
    guidance_scale: 3.0
    device: "cuda"
    dtype: "bfloat16"
  max_requests_per_minute: null
  max_requests_per_day: null

working_dir: .working_dir/idea2video_local
