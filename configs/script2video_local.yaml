# ViMax Local Configuration (Script-to-Video)
# =============================================
# Same as idea2video_local.yaml but for the script2video pipeline.
#
# Uses:
#   - GPT-OSS 120B via Groq (FREE, fast) for planning
#   - FLUX.1-schnell (local) for image generation
#   - LTX-Video 2 (local) for video generation
#
# Required environment variables:
#   - GROQ_API_KEY: Your Groq API key from https://console.groq.com/keys

chat_model:
  init_args:
    model: openai/gpt-oss-120b
    model_provider: openai
    api_key:  # Set GROQ_API_KEY env var, or paste key here
    base_url: https://api.groq.com/openai/v1
  max_requests_per_minute: 30
  max_requests_per_day: 1000

image_generator:
  class_path: tools.ImageGeneratorFluxLocal
  init_args:
    model_id: "black-forest-labs/FLUX.1-schnell"
    num_inference_steps: 4
    height: 900
    width: 1600
    guidance_scale: 0.0
    device: "cuda"
    dtype: "bfloat16"
  max_requests_per_minute: null
  max_requests_per_day: null

video_generator:
  class_path: tools.VideoGeneratorLTXLocal
  init_args:
    model_id: "Lightricks/LTX-Video-0.9.7"
    num_inference_steps: 30
    height: 720
    width: 1280
    num_frames: 121
    fps: 24
    guidance_scale: 3.0
    device: "cuda"
    dtype: "bfloat16"
  max_requests_per_minute: null
  max_requests_per_day: null

working_dir: .working_dir/script2video_local
