# ViMax Local Configuration (Script-to-Video)
# =============================================
# Same as idea2video_local.yaml but for the script2video pipeline.
#
# Uses:
#   - Claude (Sonnet/Opus) via Anthropic API for planning
#   - FLUX.1-dev (local) for image generation
#   - LTX-Video 2 (local) for video generation
#
# Required environment variables:
#   - ANTHROPIC_API_KEY: Your Anthropic API key for Claude

chat_model:
  init_args:
    model: anthropic/claude-sonnet-4-20250514
    model_provider: openai
    api_key:  # Set ANTHROPIC_API_KEY env var, or paste key here
    base_url: https://api.anthropic.com/v1
  max_requests_per_minute: 50
  max_requests_per_day: 1000

image_generator:
  class_path: tools.ImageGeneratorFluxLocal
  init_args:
    model_id: "black-forest-labs/FLUX.1-dev"
    num_inference_steps: 28
    height: 900
    width: 1600
    guidance_scale: 3.5
    device: "cuda"
    dtype: "bfloat16"
  max_requests_per_minute: null
  max_requests_per_day: null

video_generator:
  class_path: tools.VideoGeneratorLTXLocal
  init_args:
    model_id: "Lightricks/LTX-Video-0.9.7"
    num_inference_steps: 30
    height: 720
    width: 1280
    num_frames: 121
    fps: 24
    guidance_scale: 3.0
    device: "cuda"
    dtype: "bfloat16"
  max_requests_per_minute: null
  max_requests_per_day: null

working_dir: .working_dir/script2video_local
